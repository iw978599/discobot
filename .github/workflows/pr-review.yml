name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  # Lets the job's own token call GitHub Models.
  models: read

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout PR branch
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch origin "pull/${PR_NUMBER}/head:pr-branch"
          git checkout pr-branch

      - name: Get PR diff
        id: diff
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # The lockfile is long and says nothing a reviewer can use.
          git diff "origin/${BASE_REF}...HEAD" -- . ':(exclude)package-lock.json' > pr.diff

          DIFF_SIZE=$(wc -c < pr.diff)
          if [ "$DIFF_SIZE" -gt 100000 ]; then
            echo "too_large=true" >> "$GITHUB_OUTPUT"
            echo "Diff is ${DIFF_SIZE} bytes (limit: 100KB)"
          else
            echo "too_large=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read review guide
        id: guide
        run: |
          if [ -f "ai-pr-review-guide.md" ]; then
            echo "guide_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "guide_exists=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ ai-pr-review-guide.md not found in repo"
          fi

      - name: AI Review with GitHub Models
        if: steps.diff.outputs.too_large == 'false' && steps.guide.outputs.guide_exists == 'true'
        id: ai_review
        # PR text is attacker-controlled, so it reaches the shell only as environment data
        # and reaches the request only through jq, which quotes it.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          PR_ADDITIONS: ${{ github.event.pull_request.additions }}
          PR_DELETIONS: ${{ github.event.pull_request.deletions }}
        run: |
          jq -n \
            --arg title "$PR_TITLE" --arg body "$PR_BODY" \
            --arg files "$PR_CHANGED_FILES" --arg additions "$PR_ADDITIONS" --arg deletions "$PR_DELETIONS" \
            --rawfile diff pr.diff --rawfile guide ai-pr-review-guide.md \
            '{
              model: "openai/gpt-4o",
              temperature: 0.3,
              max_tokens: 4000,
              messages: [
                { role: "system", content: "You are an expert code reviewer. Follow the provided framework exactly and give thorough, actionable feedback." },
                { role: "user", content: ("Review this pull request using the comprehensive framework below.\n\nPR Title: \($title)\nPR Description: \($body)\n\nFiles Changed: \($files)\nAdditions: +\($additions)\nDeletions: -\($deletions)\n\nDiff:\n```diff\n\($diff)\n```\n\nReview Framework:\n\($guide)\n") }
              ]
            }' > request.json

          # A review that cannot run is reported on the pull request; it does not fail the check.
          STATUS=$(curl -sS -o response.json -w '%{http_code}' \
            --retry 3 --retry-all-errors --retry-delay 5 --max-time 180 \
            -X POST "https://models.github.ai/inference/chat/completions" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            --data @request.json 2> curl-error.txt) || STATUS="000"

          REVIEW=""
          if [ "$STATUS" = "200" ]; then
            REVIEW=$(jq -r '.choices[0].message.content // empty' response.json 2>/dev/null || true)
          fi

          if [ -n "$REVIEW" ]; then
            printf '%s\n' "$REVIEW" > review.md
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            {
              if [ "$STATUS" = "000" ]; then
                echo "The model service could not be reached: $(head -c 300 curl-error.txt)"
              else
                echo "The model service answered ${STATUS}: $(jq -r '.error.message // .message // empty' response.json 2>/dev/null | head -c 500)"
              fi
            } > review-error.txt
            echo "::warning::AI review did not run. $(cat review-error.txt)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post review as comment
        if: steps.ai_review.outputs.ok == 'true' || steps.ai_review.outputs.ok == 'false'
        uses: actions/github-script@v7
        env:
          REVIEW_OK: ${{ steps.ai_review.outputs.ok }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const marker = '<!-- ai-code-review -->';
            const body = process.env.REVIEW_OK === 'true'
              ? `${marker}\n## 🤖 AI Code Review\n\n${fs.readFileSync('review.md', 'utf8')}\n\n---\n<sub>Powered by GitHub Models | [Review Guide](ai-pr-review-guide.md)</sub>`
              : `${marker}\n## 🤖 AI Code Review\n\n⚠️ The automated review did not run for the latest commit. ${fs.readFileSync('review-error.txt', 'utf8').trim()}`;

            // One comment per pull request, replaced on every push.
            const target = { owner: context.repo.owner, repo: context.repo.repo };
            const comments = await github.paginate(github.rest.issues.listComments, { ...target, issue_number: context.issue.number, per_page: 100 });
            const previous = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.startsWith(marker));
            if (previous) await github.rest.issues.updateComment({ ...target, comment_id: previous.id, body });
            else await github.rest.issues.createComment({ ...target, issue_number: context.issue.number, body });

      - name: Handle large diff
        if: steps.diff.outputs.too_large == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⚠️ This PR is too large for automated AI review (>100KB diff). Please request manual review or split into smaller PRs.'
            });

      - name: Handle missing guide
        if: steps.guide.outputs.guide_exists == 'false'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⚠️ AI review guide not found. Please add `ai-pr-review-guide.md` to the repository root.'
            });
