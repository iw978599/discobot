name: Static app CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  # The browser tests are most of the time a run takes, and half of them are the same tests at
  # phone width. Each width's spec files are dealt out to four machines, so eight run at once and
  # the wait is the slowest quarter, not the whole suite. Each machine has its own copy of the app
  # and of the accounts API, so the specs still run one at a time against the server they reset.
  browser:
    runs-on: ubuntu-latest
    # A whole quarter takes about three minutes. A machine that has stopped is given up on.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-chromium]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The browser is kept from one run to the next and fetched again only when Playwright's
      # version changes (the lock file). Fetching it on every machine was slow, and twice on
      # 2026-10-12 the download stopped for minutes on a machine that was otherwise well, then
      # came all at once. So when it does have to be fetched, an attempt that has not finished in
      # two and a half minutes is dropped and made again.
      - id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: timeout 150 npx playwright install chromium || timeout 150 npx playwright install chromium || timeout 150 npx playwright install chromium
        timeout-minutes: 9
      # What the browser needs from the system. GitHub's machines have nearly all of it already.
      - run: npx playwright install-deps chromium
        timeout-minutes: 5
      - run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/4
        # A branch named for a design review also takes its pictures (design-shots.spec.ts).
        env:
          DESIGN_SHOTS: ${{ contains(github.head_ref, 'design-review') && '1' || '' }}
      # Nobody watches these run. When a test fails, what Playwright kept for it (a screenshot,
      # the page as it stood and a trace of every step) is kept for a week. That is done even when
      # the job passes, because a test that failed and then passed on its second go leaves them too.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
  # The four machines' results for a width are put back together under the name they have always
  # had (test-results-chromium, test-results-mobile-chromium), so one download gets them all.
  results:
    if: ${{ !cancelled() }}
    needs: browser
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, mobile-chromium]
    steps:
      - uses: actions/upload-artifact/merge@v4
        # With nothing kept by any machine there is nothing to put together, which is not a failure.
        continue-on-error: true
        with:
          name: test-results-${{ matrix.project }}
          pattern: test-results-${{ matrix.project }}-*
          delete-merged: true
          retention-days: 7
