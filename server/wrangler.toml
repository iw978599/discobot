name = "discobot-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://iw978599.github.io"

[[d1_databases]]
binding = "DB"
database_name = "discobot"
database_id = "20bd0b73-0695-4152-b918-173938af5037"
migrations_dir = "migrations"

[observability]
enabled = false

# Live sessions (src/live.ts): one Durable Object for each shared project, holding the connections of
# the people who have it open. The free plan's Durable Objects are SQLite-backed, so the class is
# declared as one, though a room stores nothing.
[[durable_objects.bindings]]
name = "LIVE"
class_name = "LiveRoomObject"

[[migrations]]
tag = "live-rooms-1"
new_sqlite_classes = ["LiveRoomObject"]
