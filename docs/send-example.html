<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Example sender</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 24px; max-width: 640px; }
  pre { background: #eee; padding: 8px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Example sender</h1>
<p>
  Sends three short drum sounds to Discobot by the handshake in <code>docs/SEND_PROTOCOL.md</code>.
  <code>?app=</code> is Discobot's address, and <code>?mode=</code> is <code>normal</code>,
  <code>twice</code> (sends twice), <code>other</code> (a frame on this page sends first) or
  <code>plain</code> (opens Discobot without <code>#receive</code>). The browser tests use it.
</p>
<button id="send">Send to Discobot</button>
<pre id="log" role="log" aria-label="Messages from Discobot"></pre>
<iframe id="other" title="Another window" hidden srcdoc="<script>onmessage = function (event) { if (event.data === 'go') parent.opened.postMessage(parent.soundsMessage('Impostor'), '*'); };</script>"></iframe>
<script>
  var query = new URLSearchParams(location.search);
  var app = query.get('app') || 'https://iw978599.github.io/discobot/';
  var mode = query.get('mode') || 'normal';
  window.opened = null;
  window.received = [];

  // A tenth of a second of a falling tone, as a 16-bit mono WAV.
  function wav(pitch) {
    var rate = 44100, count = 4410, buffer = new ArrayBuffer(44 + count * 2), view = new DataView(buffer);
    var text = function (at, value) { for (var i = 0; i < value.length; i++) view.setUint8(at + i, value.charCodeAt(i)); };
    text(0, 'RIFF'); view.setUint32(4, 36 + count * 2, true); text(8, 'WAVE');
    text(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
    view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
    text(36, 'data'); view.setUint32(40, count * 2, true);
    for (var i = 0; i < count; i++) view.setInt16(44 + i * 2, Math.round(Math.sin(2 * Math.PI * pitch * i / rate) * (1 - i / count) * 12000), true);
    return buffer;
  }

  // One sound for a lane, one for none (its name says snare), and one for a lane that is not one.
  window.soundsMessage = function (from) {
    return { discobotImport: 1, type: 'sounds', v: 1, from: from, files: [
      { name: 'thing-a.wav', mime: 'audio/wav', lane: 'kick', data: wav(60) },
      { name: 'snare-1.wav', mime: 'audio/wav', lane: null, data: wav(200) },
      { name: 'zzz.wav', mime: 'audio/wav', lane: 'bogus', data: wav(900) },
    ] };
  };
  function send(from) {
    var message = window.soundsMessage(from);
    window.opened.postMessage(message, new URL(app).origin, message.files.map(function (file) { return file.data; }));
  }

  window.addEventListener('message', function (event) {
    if (event.source !== window.opened || event.origin !== new URL(app).origin) return;
    var data = event.data;
    if (!data || data.discobotImport !== 1) return;
    window.received.push(data);
    document.getElementById('log').textContent += JSON.stringify(data) + '\n';
    if (data.type !== 'ready') return;
    if (mode === 'other') {
      document.getElementById('other').contentWindow.postMessage('go', '*');
      setTimeout(function () { send('Example Sender'); }, 1500);
    } else {
      send('Example Sender');
      if (mode === 'twice') send('Second Sender');
    }
  });

  document.getElementById('send').addEventListener('click', function () {
    window.opened = window.open(app + (mode === 'plain' ? '' : '#receive'));
  });
</script>
</body>
</html>
