<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beat Bell: a minimal Discobot guest</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 20px; color: #1c1c1c; background: #f6f4ee; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  label { display: inline-flex; gap: 6px; align-items: center; margin-right: 14px; }
  #status { margin-top: 12px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; white-space: pre-line; }
  button, select { font: inherit; padding: 4px 10px; }
</style>
</head>
<body>
<h1>Beat Bell</h1>
<p>Rings a note on every beat. A complete, minimal example of a Discobot guest instrument: see <code>GUEST_PROTOCOL.md</code>.</p>
<label>Note <select id="note" aria-label="Note"></select></label>
<label>Sound <select id="wave" aria-label="Sound"><option>triangle</option><option>sine</option><option>square</option></select></label>
<label id="voice-control" hidden>Voice <select id="voice" aria-label="Voice"><option value="">None</option></select></label>
<button id="keep" hidden>Keep a Recording</button>
<button id="start">Start</button>
<div id="status" role="status"></div>

<script>
(function () {
  'use strict';
  var PROTOCOL = 1;
  var SEND_DELAY_MS = Math.max(0, Math.min(2000, Number(new URLSearchParams(location.search).get('delay')) || 0));
  // ?input=1 makes this a guest that takes one of the host's voices (the optional "input" feature)
  // and plays it back, as an effect would after doing something to it. It then rings no bell.
  var TAKES_INPUT = new URLSearchParams(location.search).get('input') === '1';
  // ?files=1 makes this a guest that keeps a file with the host's project (the optional "files"
  // feature): a short recording, made by a button, whose id is kept in the settings.
  var KEEPS_FILES = new URLSearchParams(location.search).get('files') === '1';
  var NOTES = ['C4', 'D4', 'E4', 'G4', 'A4', 'C5'], MIDI = [60, 62, 64, 67, 69, 72];

  // ---- the instrument itself: a note on every beat
  var state = { note: 'C4', wave: 'triangle' };
  if (TAKES_INPUT) state.input = null;
  if (KEEPS_FILES) state.recording = null;
  var ctx = null, output = null, monitor = null;
  var transport = { playing: false };   // { playing, bpm, anchorWall, anchorBeat }
  var nextBeat = 0, scheduled = 0, timer = null;

  // ---- hosting
  var hosted = window.parent !== window;
  var host = null, hostOrigin = null;    // set by the first message from the page that frames this one
  var latencyMs = 0;                     // how early the host wants everything played
  var streaming = false, blocksSent = 0;

  function wallNow() { return performance.timeOrigin + performance.now(); }
  // The audio-clock time at which sound scheduled for `wall` is heard, and the reverse.
  function ctxAtWall(wall) {
    var stamp = ctx.getOutputTimestamp ? ctx.getOutputTimestamp() : null;
    if (stamp && stamp.performanceTime && stamp.contextTime) return stamp.contextTime + (wall - (performance.timeOrigin + stamp.performanceTime)) / 1000;
    return ctx.currentTime + (wall - wallNow()) / 1000;
  }
  function wallAtCtx(time) {
    var stamp = ctx.getOutputTimestamp ? ctx.getOutputTimestamp() : null;
    if (stamp && stamp.performanceTime && stamp.contextTime) return performance.timeOrigin + stamp.performanceTime + (time - stamp.contextTime) * 1000;
    return wallNow() + (time - ctx.currentTime) * 1000;
  }
  function wallOfBeat(beat) { return transport.anchorWall + (beat - transport.anchorBeat) * 60000 / transport.bpm; }
  function beatAtWall(wall) { return transport.anchorBeat + (wall - transport.anchorWall) * transport.bpm / 60000; }

  function ensureAudio() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    ctx = new AudioContext();
    output = ctx.createGain();
    monitor = ctx.createGain();           // this page's own speakers; silenced while the host carries the sound
    output.connect(monitor).connect(ctx.destination);
    if (streaming) startStreaming();
  }

  function ring(time) {
    var osc = ctx.createOscillator(), amp = ctx.createGain();
    osc.type = state.wave;
    osc.frequency.value = 440 * Math.pow(2, (MIDI[NOTES.indexOf(state.note)] - 69) / 12);
    amp.gain.setValueAtTime(0, time);
    amp.gain.linearRampToValueAtTime(0.5, time + 0.005);
    amp.gain.exponentialRampToValueAtTime(0.001, time + 0.3);
    osc.connect(amp).connect(output);
    osc.start(time); osc.stop(time + 0.32);
    scheduled += 1;
  }

  // Look a little way ahead and place every beat that falls in that window. Each beat is
  // played `latencyMs` early: the host holds the audio back by the same amount.
  function pump() {
    if (!transport.playing || !ctx) return;
    var horizon = wallNow() + 150;
    while (wallOfBeat(nextBeat) - latencyMs < horizon) {
      var time = ctxAtWall(wallOfBeat(nextBeat) - latencyMs);
      if (time > ctx.currentTime && !TAKES_INPUT) ring(time);
      nextBeat += 1;
    }
    show();
  }

  function setTransport(next) {
    transport = next;
    clearInterval(timer); timer = null;
    if (!next.playing) { show(); return; }
    ensureAudio();
    // The first whole beat that can still be played on time.
    nextBeat = Math.max(0, Math.ceil(beatAtWall(wallNow() + latencyMs + 20) - 1e-9));
    timer = setInterval(pump, 25);
    pump();
  }

  // ---- sending this page's sound to the host
  var TAP = 'class Tap extends AudioWorkletProcessor {' +
    'constructor(){ super(); this.l = new Float32Array(1024); this.r = new Float32Array(1024); this.n = 0; this.start = 0; }' +
    'process(inputs){ var input = inputs[0]; if(this.n === 0) this.start = currentFrame;' +
    ' var a = input && input[0], b = input && (input[1] || input[0]);' +
    ' for(var i = 0; i < 128; i++){ this.l[this.n + i] = a ? a[i] : 0; this.r[this.n + i] = b ? b[i] : 0; }' +
    ' this.n += 128;' +
    ' if(this.n >= 1024){ this.port.postMessage({ frame: this.start, l: this.l, r: this.r }, [this.l.buffer, this.r.buffer]);' +
    '  this.l = new Float32Array(1024); this.r = new Float32Array(1024); this.n = 0; }' +
    ' return true; } }' +
    'registerProcessor("guest-tap", Tap);';
  var tapReady = null, tap = null;
  function startStreaming() {
    streaming = true;
    if (!ctx) return;
    monitor.gain.value = 0;
    if (tap) return;
    tapReady = tapReady || ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([TAP], { type: 'application/javascript' })));
    tapReady.then(function () {
      if (tap || !streaming) return;
      tap = new AudioWorkletNode(ctx, 'guest-tap', { numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [2] });
      tap.port.onmessage = function (event) {
        // `wall` is when the first sample of this block would have been heard on this page.
        var message = { type: 'audio', wall: wallAtCtx(event.data.frame / ctx.sampleRate), sampleRate: ctx.sampleRate, left: event.data.l, right: event.data.r };
        var transfer = [event.data.l.buffer, event.data.r.buffer];
        // For testing a slow path between the frame and the host: ?delay=200 holds every block back 200 ms.
        if (SEND_DELAY_MS > 0) setTimeout(function () { send(message, transfer); }, SEND_DELAY_MS); else send(message, transfer);
        blocksSent += 1;
      };
      output.connect(tap);
      tap.connect(ctx.destination);   // the tap outputs silence; this only keeps it running
    });
  }
  function stopStreaming() {
    streaming = false;
    if (monitor) monitor.gain.value = 1;
    if (tap) { try { output.disconnect(tap); tap.disconnect(); } catch (e) {} tap = null; }
  }

  // ---- a voice of the host's, played back: each block where it falls, `latencyMs` early like
  // everything else, so that the host, holding this page's sound back by as much, hears it on time.
  var sources = [], selected = null, inputBlocks = 0, lateRun = 0, worstLate = 0;
  function playInput(m) {
    if (!ctx || !(m.left instanceof Float32Array) || !(m.right instanceof Float32Array) || m.left.length !== m.right.length || !m.left.length) return;
    var rate = Number(m.sampleRate);
    if (!(rate >= 8000 && rate <= 192000)) return;
    var buffer = ctx.createBuffer(2, m.left.length, rate);
    buffer.copyToChannel(m.left, 0); buffer.copyToChannel(m.right, 1);
    var when = ctxAtWall(Number(m.wall) - latencyMs), late = ctx.currentTime + 0.005 - when;
    if (late > 0) {
      // Too late to play where it belongs: play it now, and after a few say how late.
      lateRun += 1; worstLate = Math.max(worstLate, late * 1000);
      if (lateRun >= 4) { send({ type: 'inputLate', ms: Math.round(worstLate) }); lateRun = 0; worstLate = 0; }
    } else { lateRun = 0; worstLate = 0; }
    var source = ctx.createBufferSource();
    source.buffer = buffer;
    source.connect(output);
    source.start(Math.max(when, ctx.currentTime));
    inputBlocks += 1;
  }
  var voiceSelect = document.getElementById('voice');
  function showSources() {
    voiceSelect.innerHTML = '<option value="">None</option>';
    sources.forEach(function (source) { var option = document.createElement('option'); option.value = source.id; option.textContent = source.name; voiceSelect.appendChild(option); });
    voiceSelect.value = state.input || '';
  }
  voiceSelect.addEventListener('change', function () { state.input = voiceSelect.value || null; send({ type: 'selectInput', source: state.input }); send({ type: 'stateChanged' }); });

  // ---- a file kept with the host's project: here a quarter second of the bell, as a WAV.
  // The host answers `putFile` with the file's id, which goes in the settings like any other
  // value; given settings with an id, the guest asks for the file back with `getFile`.
  var recordingBytes = 0, recordingNote = 'none', asked = 0;
  function bellWav() {
    var rate = 8000, frames = rate / 4, bytes = new DataView(new ArrayBuffer(44 + frames * 2));
    var text = function (at, value) { for (var i = 0; i < value.length; i++) bytes.setUint8(at + i, value.charCodeAt(i)); };
    var hz = 440 * Math.pow(2, (MIDI[NOTES.indexOf(state.note)] - 69) / 12);
    text(0, 'RIFF'); bytes.setUint32(4, 36 + frames * 2, true); text(8, 'WAVEfmt ');
    bytes.setUint32(16, 16, true); bytes.setUint16(20, 1, true); bytes.setUint16(22, 1, true);
    bytes.setUint32(24, rate, true); bytes.setUint32(28, rate * 2, true); bytes.setUint16(32, 2, true); bytes.setUint16(34, 16, true);
    text(36, 'data'); bytes.setUint32(40, frames * 2, true);
    for (var f = 0; f < frames; f++) bytes.setInt16(44 + f * 2, Math.round(Math.sin(2 * Math.PI * hz * f / rate) * (1 - f / frames) * 12000), true);
    return bytes.buffer;
  }
  document.getElementById('keep').addEventListener('click', function () {
    var data = bellWav();
    recordingNote = 'keeping…';
    send({ type: 'putFile', id: 'keep-' + (++asked), mime: 'audio/wav', data: data }, [data]);
    show();
  });
  function fetchRecording() {
    recordingBytes = 0;
    recordingNote = state.recording ? 'loading…' : 'none';
    if (state.recording) send({ type: 'getFile', id: 'get-' + (++asked), file: state.recording });
  }

  // ---- messages
  function send(message, transfer) {
    if (!hosted) return;
    message.discobotGuest = PROTOCOL;
    // Before the host has spoken its address is unknown; "ready" carries nothing private.
    window.parent.postMessage(message, hostOrigin || '*', transfer || []);
  }
  window.addEventListener('message', function (event) {
    if (!hosted || event.source !== window.parent) return;
    var m = event.data;
    if (!m || m.discobotGuest !== PROTOCOL) return;
    host = event.source; hostOrigin = event.origin;
    if (m.type === 'hello') { latencyMs = Math.max(0, Math.min(1000, Number(m.latencyMs) || 0)); document.getElementById('start').hidden = true; }
    else if (m.type === 'transport') setTransport(m.playing ? { playing: true, bpm: Number(m.bpm), anchorWall: Number(m.anchorWall), anchorBeat: Number(m.anchorBeat) } : { playing: false });
    else if (m.type === 'getState') send({ type: 'state', id: m.id, state: state });
    else if (m.type === 'setState') applyState(m.state);
    else if (m.type === 'audio') { if (m.on) startStreaming(); else stopStreaming(); }
    else if (TAKES_INPUT && m.type === 'sources' && Array.isArray(m.sources)) {
      sources = m.sources.filter(function (s) { return s && typeof s.id === 'string' && typeof s.name === 'string'; });
      showSources();
      // The voice these settings name is asked for again: after a reload, or a scene that wants it.
      if (state.input !== selected) send({ type: 'selectInput', source: state.input });
    }
    else if (TAKES_INPUT && m.type === 'inputSelected') selected = typeof m.source === 'string' ? m.source : null;
    else if (TAKES_INPUT && m.type === 'input') { ensureAudio(); playInput(m); }
    else if (KEEPS_FILES && m.type === 'fileStored') {
      if (typeof m.file === 'string') { state.recording = m.file; recordingBytes = 0; recordingNote = 'kept'; send({ type: 'stateChanged' }); fetchRecording(); }
      else recordingNote = 'not kept: ' + String(m.error);
    }
    else if (KEEPS_FILES && m.type === 'file' && m.file === state.recording) {
      if (m.data instanceof ArrayBuffer) { recordingBytes = m.data.byteLength; recordingNote = 'loaded, ' + m.mime; }
      else recordingNote = 'missing';
    }
    show();
  });

  // ---- state and controls
  function applyState(next) {
    if (!next || typeof next !== 'object') return;
    if (NOTES.indexOf(next.note) >= 0) state.note = next.note;
    if (['triangle', 'sine', 'square'].indexOf(next.wave) >= 0) state.wave = next.wave;
    noteSelect.value = state.note; waveSelect.value = state.wave;
    if (KEEPS_FILES) {
      var recording = typeof next.recording === 'string' ? next.recording : null;
      if (recording !== state.recording || (recording && !recordingBytes)) { state.recording = recording; fetchRecording(); }
    }
    if (TAKES_INPUT) {
      var wanted = typeof next.input === 'string' ? next.input : null;
      if (wanted !== state.input) { state.input = wanted; showSources(); if (sources.length) send({ type: 'selectInput', source: wanted }); }
    }
  }
  var noteSelect = document.getElementById('note'), waveSelect = document.getElementById('wave');
  NOTES.forEach(function (name) { var option = document.createElement('option'); option.textContent = name; noteSelect.appendChild(option); });
  noteSelect.addEventListener('change', function () { state.note = noteSelect.value; send({ type: 'stateChanged' }); });
  // "stateChanged" is optional. This control does not send it, to show that the host still gets the
  // change: it asks every few seconds, and again whenever the scene is about to change.
  waveSelect.addEventListener('change', function () { state.wave = waveSelect.value; });
  document.getElementById('start').addEventListener('click', function () {
    // On its own, the page keeps its own time.
    if (transport.playing) setTransport({ playing: false });
    else { ensureAudio(); setTransport({ playing: true, bpm: 120, anchorWall: wallNow() + 100, anchorBeat: 0 }); }
  });

  function show() {
    document.getElementById('status').textContent =
      (hostOrigin ? 'Hosted by ' + hostOrigin : hosted ? 'In a frame, waiting for the host' : 'Standalone') +
      '\n' + (transport.playing ? 'Playing at ' + transport.bpm + ' BPM' : 'Stopped') +
      '\nBeats played: ' + scheduled +
      '\nAudio blocks sent: ' + blocksSent +
      (TAKES_INPUT ? '\nVoice: ' + (selected || 'none') + ', blocks received: ' + inputBlocks : '') +
      (KEEPS_FILES ? '\nRecording: ' + recordingNote + (recordingBytes ? ', ' + recordingBytes + ' bytes' : '') : '') +
      (ctx && ctx.state !== 'running' ? '\nAudio is waiting for a click on this page' : '');
  }
  show();
  document.getElementById('voice-control').hidden = !TAKES_INPUT;
  // Kept only while hosted: a page on its own has nowhere to keep a file.
  document.getElementById('keep').hidden = !KEEPS_FILES || !hosted;
  send({ type: 'ready', name: 'Beat Bell', features: ['transport', 'state', 'audio'].concat(TAKES_INPUT ? ['input'] : [], KEEPS_FILES ? ['files'] : []) });
})();
</script>
</body>
</html>
